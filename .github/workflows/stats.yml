name: Generate Stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate stats image
        uses: cicirello/user-statistician@v1
        with:
          image-file: github-user-stats.svg
          colors: dark-dimmed
          hide-keys: mostStarred, mostForked, followers, following, watching, contribTo, prReviews, issues, languages
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
